name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project ZIP
        run: |
          unzip -q DailyQuoteWidget-Android-NewProject.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then echo 'Project settings file missing'; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: DailyQuoteWidget-APK
          path: dist/*.apk
